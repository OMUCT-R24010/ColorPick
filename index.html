<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorPick - RGB色当てゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎨 ColorPick</h1>
        <p class="subtitle">見本の色と同じ色をRGBで探そう！</p>

        <div class="difficulty-selector">
            <button class="difficulty-btn easy" data-difficulty="easy">
                🟢 簡単<br>
                <small>45秒 / 緩い判定</small>
            </button>
            <button class="difficulty-btn normal active" data-difficulty="normal">
                🟡 普通<br>
                <small>30秒 / 標準判定</small>
            </button>
            <button class="difficulty-btn hard" data-difficulty="hard">
                🔴 難しい<br>
                <small>30秒 / 厳しい判定</small>
            </button>
        </div>

        <div class="difficulty-info" id="difficultyInfo">
            現在の難易度: 普通 | ラウンドごとに30秒 | 標準の精度判定
        </div>

        <div class="game-info">
            <div class="info-item">
                <div class="info-label">残り時間</div>
                <div class="info-value timer" id="timer">30</div>
            </div>
            <div class="info-item">
                <div class="info-label">スコア</div>
                <div class="info-value score" id="score">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">ラウンド</div>
                <div class="info-value" id="round">1</div>
            </div>
        </div>

        <div class="color-display">
            <div class="color-box" id="targetColor">
                <div class="color-label">見本の色</div>
            </div>
            <div class="color-box" id="playerColor">
                <div class="color-label">あなたの色</div>
            </div>
        </div>

        <div class="controls">
            <div class="slider-group">
                <div class="slider-label">
                    <span class="slider-name">🔴 Red</span>
                    <span class="slider-value" id="redValue">128</span>
                </div>
                <input type="range" id="redSlider" min="0" max="255" value="128">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span class="slider-name">🟢 Green</span>
                    <span class="slider-value" id="greenValue">128</span>
                </div>
                <input type="range" id="greenSlider" min="0" max="255" value="128">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span class="slider-name">🔵 Blue</span>
                    <span class="slider-value" id="blueValue">128</span>
                </div>
                <input type="range" id="blueSlider" min="0" max="255" value="128">
            </div>
        </div>

        <div class="buttons">
            <button class="check-btn" id="checkBtn">チェック</button>
            <button class="new-game-btn" id="newGameBtn">新しいゲーム</button>
        </div>

        <div class="result" id="result"></div>

        <div class="game-over" id="gameOver">
            <h2>ゲーム終了！</h2>
            <p>最終スコア</p>
            <div class="final-score" id="finalScore">0</div>
            <p>クリアしたラウンド数: <span id="roundsCleared">0</span></p>
        </div>
    </div>

    <script>
        // Game constants
        const MAX_RGB_DIFFERENCE = 765; // 255 * 3
        
        // Difficulty settings
        const DIFFICULTIES = {
            easy: {
                name: '簡単',
                time: 45,
                thresholds: {
                    excellent: 50,
                    good: 100,
                    close: 150
                },
                scores: {
                    perfect: 100,
                    excellent: 50,
                    good: 30,
                    close: 10
                },
                info: 'ラウンドごとに45秒 | 緩い精度判定'
            },
            normal: {
                name: '普通',
                time: 30,
                thresholds: {
                    excellent: 30,
                    good: 60,
                    close: 100
                },
                scores: {
                    perfect: 100,
                    excellent: 50,
                    good: 30,
                    close: 10
                },
                info: 'ラウンドごとに30秒 | 標準の精度判定'
            },
            hard: {
                name: '難しい',
                time: 30,
                thresholds: {
                    excellent: 15,
                    good: 40,
                    close: 70
                },
                scores: {
                    perfect: 150,
                    excellent: 80,
                    good: 40,
                    close: 15
                },
                info: 'ラウンドごとに30秒 | 厳しい精度判定'
            }
        };

        // Game state
        let currentDifficulty = 'normal';
        let targetR, targetG, targetB;
        let playerR = 128, playerG = 128, playerB = 128;
        let score = 0;
        let round = 1;
        let timeLeft = DIFFICULTIES[currentDifficulty].time;
        let timerInterval = null;
        let gameActive = false;

        // DOM elements
        const redSlider = document.getElementById('redSlider');
        const greenSlider = document.getElementById('greenSlider');
        const blueSlider = document.getElementById('blueSlider');
        const redValue = document.getElementById('redValue');
        const greenValue = document.getElementById('greenValue');
        const blueValue = document.getElementById('blueValue');
        const targetColorBox = document.getElementById('targetColor');
        const playerColorBox = document.getElementById('playerColor');
        const checkBtn = document.getElementById('checkBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const resultDiv = document.getElementById('result');
        const timerDisplay = document.getElementById('timer');
        const scoreDisplay = document.getElementById('score');
        const roundDisplay = document.getElementById('round');
        const gameOverDiv = document.getElementById('gameOver');
        const finalScoreDisplay = document.getElementById('finalScore');
        const roundsClearedDisplay = document.getElementById('roundsCleared');
        const difficultyBtns = document.querySelectorAll('.difficulty-btn');
        const difficultyInfo = document.getElementById('difficultyInfo');

        // Generate random target color
        function generateTargetColor() {
            targetR = Math.floor(Math.random() * 256);
            targetG = Math.floor(Math.random() * 256);
            targetB = Math.floor(Math.random() * 256);
            targetColorBox.style.backgroundColor = `rgb(${targetR}, ${targetG}, ${targetB})`;
        }

        // Update player color
        function updatePlayerColor() {
            playerR = parseInt(redSlider.value);
            playerG = parseInt(greenSlider.value);
            playerB = parseInt(blueSlider.value);
            
            redValue.textContent = playerR;
            greenValue.textContent = playerG;
            blueValue.textContent = playerB;
            
            playerColorBox.style.backgroundColor = `rgb(${playerR}, ${playerG}, ${playerB})`;
        }

        // Calculate color difference
        function calculateDifference() {
            const diffR = Math.abs(targetR - playerR);
            const diffG = Math.abs(targetG - playerG);
            const diffB = Math.abs(targetB - playerB);
            return diffR + diffG + diffB;
        }

        // Check color match
        function checkColor() {
            if (!gameActive) return;

            const difficulty = DIFFICULTIES[currentDifficulty];
            const difference = calculateDifference();
            const accuracy = ((MAX_RGB_DIFFERENCE - difference) / MAX_RGB_DIFFERENCE * 100).toFixed(1);
            
            resultDiv.className = 'result show';
            
            if (difference === 0) {
                resultDiv.className = 'result show success';
                resultDiv.textContent = `🎉 完璧！ 100%の精度！ +${difficulty.scores.perfect}点`;
                score += difficulty.scores.perfect;
                setTimeout(nextRound, 1500);
            } else if (difference <= difficulty.thresholds.excellent) {
                resultDiv.className = 'result show success';
                resultDiv.textContent = `✨ 素晴らしい！ 精度${accuracy}% +${difficulty.scores.excellent}点`;
                score += difficulty.scores.excellent;
                setTimeout(nextRound, 1500);
            } else if (difference <= difficulty.thresholds.good) {
                resultDiv.className = 'result show info';
                resultDiv.textContent = `👍 良い！ 精度${accuracy}% +${difficulty.scores.good}点`;
                score += difficulty.scores.good;
                setTimeout(nextRound, 1500);
            } else if (difference <= difficulty.thresholds.close) {
                resultDiv.className = 'result show warning';
                resultDiv.textContent = `🤔 もう少し！ 精度${accuracy}% +${difficulty.scores.close}点`;
                score += difficulty.scores.close;
                setTimeout(nextRound, 1500);
            } else {
                resultDiv.className = 'result show warning';
                resultDiv.textContent = `❌ 差が大きいです。精度${accuracy}% R:${Math.abs(targetR - playerR)} G:${Math.abs(targetG - playerG)} B:${Math.abs(targetB - playerB)}`;
            }
            
            updateScore();
        }

        // Next round
        function nextRound() {
            round++;
            roundDisplay.textContent = round;
            generateTargetColor();
            resetSliders();
            resultDiv.className = 'result';
            // Reset timer to full time for each round
            timeLeft = DIFFICULTIES[currentDifficulty].time;
            timerDisplay.textContent = timeLeft;
            timerDisplay.classList.remove('warning');
        }

        // Reset sliders
        function resetSliders() {
            redSlider.value = 128;
            greenSlider.value = 128;
            blueSlider.value = 128;
            updatePlayerColor();
        }

        // Update score display
        function updateScore() {
            scoreDisplay.textContent = score;
        }

        // Timer countdown
        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                
                // Add warning animation when time is low
                if (timeLeft <= 10) {
                    timerDisplay.classList.add('warning');
                } else {
                    timerDisplay.classList.remove('warning');
                }
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // End game
        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            checkBtn.disabled = true;
            gameOverDiv.className = 'game-over show';
            finalScoreDisplay.textContent = score;
            roundsClearedDisplay.textContent = round - 1;
        }

        // Start new game
        function startNewGame() {
            score = 0;
            round = 1;
            timeLeft = DIFFICULTIES[currentDifficulty].time;
            gameActive = true;
            
            scoreDisplay.textContent = score;
            roundDisplay.textContent = round;
            timerDisplay.textContent = timeLeft;
            timerDisplay.classList.remove('warning');
            checkBtn.disabled = false;
            
            gameOverDiv.className = 'game-over';
            resultDiv.className = 'result';
            
            generateTargetColor();
            resetSliders();
            
            if (timerInterval !== null) {
                clearInterval(timerInterval);
            }
            startTimer();
        }

        // Change difficulty
        function changeDifficulty(difficulty) {
            if (gameActive) {
                if (!confirm('ゲーム中です。難易度を変更すると新しいゲームが開始されます。よろしいですか？')) {
                    return;
                }
            }
            
            currentDifficulty = difficulty;
            
            // Update UI
            difficultyBtns.forEach(btn => {
                if (btn.dataset.difficulty === difficulty) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            difficultyInfo.textContent = `現在の難易度: ${DIFFICULTIES[difficulty].name} | ${DIFFICULTIES[difficulty].info}`;
            
            // Start new game with new difficulty
            if (timerInterval !== null) {
                clearInterval(timerInterval);
            }
            startNewGame();
        }

        // Event listeners
        redSlider.addEventListener('input', updatePlayerColor);
        greenSlider.addEventListener('input', updatePlayerColor);
        blueSlider.addEventListener('input', updatePlayerColor);
        checkBtn.addEventListener('click', checkColor);
        newGameBtn.addEventListener('click', startNewGame);
        
        difficultyBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                changeDifficulty(btn.dataset.difficulty);
            });
        });

        // Initialize game
        difficultyInfo.textContent = `現在の難易度: ${DIFFICULTIES[currentDifficulty].name} | ${DIFFICULTIES[currentDifficulty].info}`;
        startNewGame();
    </script>
</body>
</html>
