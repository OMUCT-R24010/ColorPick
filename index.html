<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorPick - RGB色当てゲーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .timer {
            color: #e74c3c;
        }

        .score {
            color: #27ae60;
        }

        .color-display {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .color-box {
            flex: 1;
            height: 150px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .color-label {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .controls {
            margin-bottom: 30px;
        }

        .slider-group {
            margin-bottom: 20px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .slider-name {
            color: #333;
        }

        .slider-value {
            color: #666;
            font-family: monospace;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            border: none;
        }

        #redSlider {
            background: linear-gradient(to right, #000, #ff0000);
        }

        #greenSlider {
            background: linear-gradient(to right, #000, #00ff00);
        }

        #blueSlider {
            background: linear-gradient(to right, #000, #0000ff);
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        button {
            flex: 1;
            padding: 15px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .check-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .new-game-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
        }

        .result.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .result.warning {
            background: #fff3cd;
            color: #856404;
        }

        .game-over {
            display: none;
            text-align: center;
            padding: 20px;
            background: #f8d7da;
            border-radius: 10px;
            margin-top: 20px;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            color: #721c24;
            margin-bottom: 10px;
        }

        .final-score {
            font-size: 2em;
            color: #721c24;
            margin: 10px 0;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .color-display {
                flex-direction: column;
            }

            .color-box {
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 ColorPick</h1>
        <p class="subtitle">見本の色と同じ色をRGBで探そう！</p>

        <div class="game-info">
            <div class="info-item">
                <div class="info-label">残り時間</div>
                <div class="info-value timer" id="timer">30</div>
            </div>
            <div class="info-item">
                <div class="info-label">スコア</div>
                <div class="info-value score" id="score">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">ラウンド</div>
                <div class="info-value" id="round">1</div>
            </div>
        </div>

        <div class="color-display">
            <div class="color-box" id="targetColor">
                <div class="color-label">見本の色</div>
            </div>
            <div class="color-box" id="playerColor">
                <div class="color-label">あなたの色</div>
            </div>
        </div>

        <div class="controls">
            <div class="slider-group">
                <div class="slider-label">
                    <span class="slider-name">🔴 Red</span>
                    <span class="slider-value" id="redValue">128</span>
                </div>
                <input type="range" id="redSlider" min="0" max="255" value="128">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span class="slider-name">🟢 Green</span>
                    <span class="slider-value" id="greenValue">128</span>
                </div>
                <input type="range" id="greenSlider" min="0" max="255" value="128">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span class="slider-name">🔵 Blue</span>
                    <span class="slider-value" id="blueValue">128</span>
                </div>
                <input type="range" id="blueSlider" min="0" max="255" value="128">
            </div>
        </div>

        <div class="buttons">
            <button class="check-btn" id="checkBtn">チェック</button>
            <button class="new-game-btn" id="newGameBtn">新しいゲーム</button>
        </div>

        <div class="result" id="result"></div>

        <div class="game-over" id="gameOver">
            <h2>ゲーム終了！</h2>
            <p>最終スコア</p>
            <div class="final-score" id="finalScore">0</div>
            <p>クリアしたラウンド数: <span id="roundsCleared">0</span></p>
        </div>
    </div>

    <script>
        // Game constants
        const MAX_RGB_DIFFERENCE = 765; // 255 * 3
        const INITIAL_TIME = 30;
        const BONUS_TIME = 5;
        const MAX_TIME = 30;
        const SCORE_PERFECT = 100;
        const SCORE_EXCELLENT = 50;
        const SCORE_GOOD = 30;
        const SCORE_CLOSE = 10;
        const THRESHOLD_EXCELLENT = 30;
        const THRESHOLD_GOOD = 60;
        const THRESHOLD_CLOSE = 100;

        // Game state
        let targetR, targetG, targetB;
        let playerR = 128, playerG = 128, playerB = 128;
        let score = 0;
        let round = 1;
        let timeLeft = INITIAL_TIME;
        let timerInterval = null;
        let gameActive = false;

        // DOM elements
        const redSlider = document.getElementById('redSlider');
        const greenSlider = document.getElementById('greenSlider');
        const blueSlider = document.getElementById('blueSlider');
        const redValue = document.getElementById('redValue');
        const greenValue = document.getElementById('greenValue');
        const blueValue = document.getElementById('blueValue');
        const targetColorBox = document.getElementById('targetColor');
        const playerColorBox = document.getElementById('playerColor');
        const checkBtn = document.getElementById('checkBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const resultDiv = document.getElementById('result');
        const timerDisplay = document.getElementById('timer');
        const scoreDisplay = document.getElementById('score');
        const roundDisplay = document.getElementById('round');
        const gameOverDiv = document.getElementById('gameOver');
        const finalScoreDisplay = document.getElementById('finalScore');
        const roundsClearedDisplay = document.getElementById('roundsCleared');

        // Generate random target color
        function generateTargetColor() {
            targetR = Math.floor(Math.random() * 256);
            targetG = Math.floor(Math.random() * 256);
            targetB = Math.floor(Math.random() * 256);
            targetColorBox.style.backgroundColor = `rgb(${targetR}, ${targetG}, ${targetB})`;
        }

        // Update player color
        function updatePlayerColor() {
            playerR = parseInt(redSlider.value);
            playerG = parseInt(greenSlider.value);
            playerB = parseInt(blueSlider.value);
            
            redValue.textContent = playerR;
            greenValue.textContent = playerG;
            blueValue.textContent = playerB;
            
            playerColorBox.style.backgroundColor = `rgb(${playerR}, ${playerG}, ${playerB})`;
        }

        // Calculate color difference
        function calculateDifference() {
            const diffR = Math.abs(targetR - playerR);
            const diffG = Math.abs(targetG - playerG);
            const diffB = Math.abs(targetB - playerB);
            return diffR + diffG + diffB;
        }

        // Check color match
        function checkColor() {
            if (!gameActive) return;

            const difference = calculateDifference();
            const accuracy = ((MAX_RGB_DIFFERENCE - difference) / MAX_RGB_DIFFERENCE * 100).toFixed(1);
            
            resultDiv.className = 'result show';
            
            if (difference === 0) {
                resultDiv.className = 'result show success';
                resultDiv.textContent = `🎉 完璧！ 100%の精度！ +${SCORE_PERFECT}点`;
                score += SCORE_PERFECT;
                setTimeout(nextRound, 1500);
            } else if (difference <= THRESHOLD_EXCELLENT) {
                resultDiv.className = 'result show success';
                resultDiv.textContent = `✨ 素晴らしい！ 精度${accuracy}% +${SCORE_EXCELLENT}点`;
                score += SCORE_EXCELLENT;
                setTimeout(nextRound, 1500);
            } else if (difference <= THRESHOLD_GOOD) {
                resultDiv.className = 'result show info';
                resultDiv.textContent = `👍 良い！ 精度${accuracy}% +${SCORE_GOOD}点`;
                score += SCORE_GOOD;
                setTimeout(nextRound, 1500);
            } else if (difference <= THRESHOLD_CLOSE) {
                resultDiv.className = 'result show warning';
                resultDiv.textContent = `🤔 もう少し！ 精度${accuracy}% +${SCORE_CLOSE}点`;
                score += SCORE_CLOSE;
                setTimeout(nextRound, 1500);
            } else {
                resultDiv.className = 'result show warning';
                resultDiv.textContent = `❌ 差が大きいです。精度${accuracy}% R:${Math.abs(targetR - playerR)} G:${Math.abs(targetG - playerG)} B:${Math.abs(targetB - playerB)}`;
            }
            
            updateScore();
        }

        // Next round
        function nextRound() {
            round++;
            roundDisplay.textContent = round;
            generateTargetColor();
            resetSliders();
            resultDiv.className = 'result';
            timeLeft += BONUS_TIME; // Add bonus time for completing a round
            if (timeLeft > MAX_TIME) timeLeft = MAX_TIME; // Cap at maximum time
        }

        // Reset sliders
        function resetSliders() {
            redSlider.value = 128;
            greenSlider.value = 128;
            blueSlider.value = 128;
            updatePlayerColor();
        }

        // Update score display
        function updateScore() {
            scoreDisplay.textContent = score;
        }

        // Timer countdown
        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // End game
        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            checkBtn.disabled = true;
            gameOverDiv.className = 'game-over show';
            finalScoreDisplay.textContent = score;
            roundsClearedDisplay.textContent = round - 1;
        }

        // Start new game
        function startNewGame() {
            score = 0;
            round = 1;
            timeLeft = INITIAL_TIME;
            gameActive = true;
            
            scoreDisplay.textContent = score;
            roundDisplay.textContent = round;
            timerDisplay.textContent = timeLeft;
            checkBtn.disabled = false;
            
            gameOverDiv.className = 'game-over';
            resultDiv.className = 'result';
            
            generateTargetColor();
            resetSliders();
            
            if (timerInterval !== null) {
                clearInterval(timerInterval);
            }
            startTimer();
        }

        // Event listeners
        redSlider.addEventListener('input', updatePlayerColor);
        greenSlider.addEventListener('input', updatePlayerColor);
        blueSlider.addEventListener('input', updatePlayerColor);
        checkBtn.addEventListener('click', checkColor);
        newGameBtn.addEventListener('click', startNewGame);

        // Initialize game
        startNewGame();
    </script>
</body>
</html>
